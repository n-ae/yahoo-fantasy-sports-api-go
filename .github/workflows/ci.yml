name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Import direction (SDK must not depend on the app layer)
        run: |
          if go list -deps ./pkg/yahoo/... | grep -E 'pkg/(service|repository)$'; then
            echo "::error::pkg/yahoo must not import pkg/service or pkg/repository"
            exit 1
          fi
          echo "ok: pkg/yahoo has no application-layer dependencies"

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...
