name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (matches the go.mod directive) and current stable.
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Import direction (SDK must not depend on the app layer)
        run: |
          if go list -deps ./pkg/yahoo/... | grep -E '(pkg|internal)/(service|repository)$'; then
            echo "::error::pkg/yahoo must not import the application layer (service/repository)"
            exit 1
          fi
          echo "ok: pkg/yahoo has no application-layer dependencies"

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l pkg cmd examples)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
          echo "ok: gofmt clean"

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
